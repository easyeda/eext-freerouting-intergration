<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeRouting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            font-size: 13px;
            background: #F5F5F5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .icon { font-size: 40px; margin-bottom: 12px; }
        .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #222; }
        .desc { color: #666; text-align: center; line-height: 1.6; margin-bottom: 12px; max-width: 380px; }
        .steps { color: #555; text-align: left; line-height: 1.8; margin-bottom: 16px; max-width: 380px; font-size: 12px; }
        .section-title { font-size: 12px; color: #999; margin-bottom: 8px; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 7px 16px;
            font-size: 12px;
            border: 1px solid #D0D0D0;
            background: #FFF;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover { background: #F0F0F0; border-color: #007AFF; color: #007AFF; }
        .btn-download {
            background: #34C759;
            border-color: #34C759;
            color: #FFF;
            padding: 8px 24px;
            font-size: 13px;
        }
        .btn-download:hover { background: #2DB84D; border-color: #2DB84D; color: #FFF; }
        .btn-primary {
            background: #007AFF;
            border-color: #007AFF;
            color: #FFF;
            padding: 8px 28px;
            font-size: 13px;
        }
        .btn-primary:hover { background: #0066DD; border-color: #0066DD; color: #FFF; }
    </style>
</head>
<body>
    <div class="icon">⚠️</div>
    <div class="title" id="titleText"></div>
    <div class="desc" id="descText"></div>
    <div class="steps" id="stepsText"></div>
    <div class="btn-group" style="margin-bottom:16px;">
        <button class="btn btn-download" onclick="openDownload()" id="btnDownloadFR"></button>
    </div>
    <div class="section-title" id="scriptTitle"></div>
    <div class="btn-group">
        <button class="btn" onclick="downloadScript('win')" id="btnWin"></button>
        <button class="btn" onclick="downloadScript('linux')" id="btnLinux"></button>
        <button class="btn" onclick="downloadScript('mac')" id="btnMac"></button>
    </div>
    <button class="btn btn-primary" onclick="retry()" id="btnRetry"></button>

    <script>
    (function() {
        'use strict';

        var i18n = {
            zh: {
                title: 'FreeRouting 服务未启动',
                desc: '请按以下步骤操作：',
                steps: '1. 下载并安装 FreeRouting (V2.3.0+)\n2. 下载并运行对应平台的启动脚本\n3. 启动成功后点击"重新检测"',
                btn_download_fr: '1. 下载 FreeRouting',
                script_title: '2. 下载启动脚本：',
                btn_win: 'Windows (.bat)',
                btn_linux: 'Linux (.sh)',
                btn_mac: 'macOS (.sh)',
                btn_retry: '3. 重新检测'
            },
            en: {
                title: 'FreeRouting Service Not Running',
                desc: 'Please follow these steps:',
                steps: '1. Download and install FreeRouting (V2.3.0+)\n2. Download and run the startup script for your platform\n3. Click "Retry" after the service starts',
                btn_download_fr: '1. Download FreeRouting',
                script_title: '2. Download startup script:',
                btn_win: 'Windows (.bat)',
                btn_linux: 'Linux (.sh)',
                btn_mac: 'macOS (.sh)',
                btn_retry: '3. Retry'
            }
        };

        var lang = 'zh';
        var T = i18n[lang];

        function applyI18n() {
            document.getElementById('titleText').textContent = T.title;
            document.getElementById('descText').textContent = T.desc;
            document.getElementById('stepsText').innerText = T.steps;
            document.getElementById('btnDownloadFR').textContent = T.btn_download_fr;
            document.getElementById('scriptTitle').textContent = T.script_title;
            document.getElementById('btnWin').textContent = T.btn_win;
            document.getElementById('btnLinux').textContent = T.btn_linux;
            document.getElementById('btnMac').textContent = T.btn_mac;
            document.getElementById('btnRetry').textContent = T.btn_retry;
            document.title = T.title;
        }

        applyI18n();

        function getEda() {
            try {
                if (window.parent && window.parent.eda) return window.parent.eda;
                if (window.top && window.top.eda) return window.top.eda;
                if (window.eda) return window.eda;
            } catch (e) {}
            return null;
        }

        (function detectLang() {
            var retries = 0;
            function tryDetect() {
                var eda = getEda();
                if (eda && eda.sys_I18n) {
                    eda.sys_I18n.getCurrentLanguage().then(function(edaLang) {
                        if (edaLang && edaLang.indexOf('zh') === -1) {
                            lang = 'en';
                            T = i18n[lang];
                            applyI18n();
                        }
                    }).catch(function() {});
                } else if (++retries < 20) {
                    setTimeout(tryDetect, 200);
                }
            }
            tryDetect();
        })();

        var SCRIPTS = {};
        SCRIPTS.win = [
            '@echo off',
            'chcp 65001 >nul 2>&1',
            'setlocal enabledelayedexpansion',
            '',
            'echo ============================================',
            'echo  FreeRouting API Server Launcher (Windows)',
            'echo ============================================',
            'echo.',
            '',
            'set "FR_EXE="',
            'if not defined FR_EXE (',
            '    if exist "%LOCALAPPDATA%\\freerouting\\app\\freerouting.exe" (',
            '        set "FR_EXE=%LOCALAPPDATA%\\freerouting\\app\\freerouting.exe"',
            '    )',
            ')',
            'if not defined FR_EXE (',
            '    if exist "%LOCALAPPDATA%\\freerouting\\freerouting.exe" (',
            '        set "FR_EXE=%LOCALAPPDATA%\\freerouting\\freerouting.exe"',
            '    )',
            ')',
            'if not defined FR_EXE (',
            '    if exist "freerouting.exe" (',
            '        set "FR_EXE=%CD%\\freerouting.exe"',
            '    )',
            ')',
            '',
            'if not defined FR_EXE (',
            '    echo [ERROR] FreeRouting exe not found.',
            '    echo.',
            '    echo Please install FreeRouting from:',
            '    echo   https://github.com/freerouting/freerouting/releases',
            '    echo.',
            '    pause',
            '    exit /b 1',
            ')',
            '',
            'echo Found: %FR_EXE%',
            'echo.',
            'echo [INFO] Starting FreeRouting API server on http://127.0.0.1:37864 ...',
            'echo [INFO] Please run FreeRouting extension at EasyEDA Pro/JLCEDA Pro.',
            'echo.',
            '',
            '"%FR_EXE%" ^',
            '    --gui.enabled=false ^',
            '    --api_server.enabled=true ^',
            '    --api_server.endpoints=http://127.0.0.1:37864 ^',
            '    --api_server.authentication.enabled=false ^',
            '    --api_server.cors_origins=* ^',
            '    --logging.console.level=ERROR',
            '',
            'echo.',
            'echo [INFO] FreeRouting API server stopped.'
        ].join('\r\n');

        SCRIPTS.linux = [
            '#!/bin/bash',
            'echo "============================================"',
            'echo " FreeRouting API Server Launcher (Linux)"',
            'echo "============================================"',
            'echo',
            '',
            'FR_EXE=""',
            'if [ -z "$FR_EXE" ] && [ -x "$HOME/.local/share/freerouting/freerouting" ]; then',
            '    FR_EXE="$HOME/.local/share/freerouting/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "/opt/freerouting/freerouting" ]; then',
            '    FR_EXE="/opt/freerouting/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "/usr/local/bin/freerouting" ]; then',
            '    FR_EXE="/usr/local/bin/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "./freerouting" ]; then',
            '    FR_EXE="./freerouting"',
            'fi',
            '',
            'if [ -z "$FR_EXE" ]; then',
            '    echo "[ERROR] FreeRouting executable not found."',
            '    echo "Please install from: https://github.com/freerouting/freerouting/releases"',
            '    exit 1',
            'fi',
            '',
            'echo "Found: $FR_EXE"',
            'echo',
            'echo "[INFO] Starting FreeRouting API server on http://127.0.0.1:37864 ..."',
            'echo "[INFO] Please run FreeRouting extension at EasyEDA Pro/JLCEDA Pro."',
            'echo',
            '"$FR_EXE" \\',
            '    --gui.enabled=false \\',
            '    --api_server.enabled=true \\',
            '    --api_server.endpoints=http://127.0.0.1:37864 \\',
            '    --api_server.authentication.enabled=false \\',
            '    --api_server.cors_origins=* \\',
            '    --logging.console.level=ERROR'
        ].join('\n');

        SCRIPTS.mac = [
            '#!/bin/bash',
            'echo "============================================"',
            'echo " FreeRouting API Server Launcher (macOS)"',
            'echo "============================================"',
            'echo',
            '',
            'FR_EXE=""',
            'if [ -z "$FR_EXE" ] && [ -x "/Applications/freerouting.app/Contents/MacOS/freerouting" ]; then',
            '    FR_EXE="/Applications/freerouting.app/Contents/MacOS/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "$HOME/Applications/freerouting.app/Contents/MacOS/freerouting" ]; then',
            '    FR_EXE="$HOME/Applications/freerouting.app/Contents/MacOS/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "$HOME/.local/share/freerouting/freerouting" ]; then',
            '    FR_EXE="$HOME/.local/share/freerouting/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "/usr/local/bin/freerouting" ]; then',
            '    FR_EXE="/usr/local/bin/freerouting"',
            'fi',
            'if [ -z "$FR_EXE" ] && [ -x "./freerouting" ]; then',
            '    FR_EXE="./freerouting"',
            'fi',
            '',
            'if [ -z "$FR_EXE" ]; then',
            '    echo "[ERROR] FreeRouting executable not found."',
            '    echo "Please install from: https://github.com/freerouting/freerouting/releases"',
            '    exit 1',
            'fi',
            '',
            'echo "Found: $FR_EXE"',
            'echo',
            'echo "[INFO] Starting FreeRouting API server on http://127.0.0.1:37864 ..."',
            'echo "[INFO] Please run FreeRouting extension at EasyEDA Pro/JLCEDA Pro."',
            'echo',
            '"$FR_EXE" \\',
            '    --gui.enabled=false \\',
            '    --api_server.enabled=true \\',
            '    --api_server.endpoints=http://127.0.0.1:37864 \\',
            '    --api_server.authentication.enabled=false \\',
            '    --api_server.cors_origins=* \\',
            '    --logging.console.level=ERROR'
        ].join('\n');

        var FILENAMES = {
            win: 'start-freerouting-windows.bat',
            linux: 'start-freerouting-linux.sh',
            mac: 'start-freerouting-mac.sh'
        };

        function triggerDownload(content, filename) {
            var blob = new Blob([content], { type: 'application/octet-stream' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.downloadScript = function(platform) {
            var content = SCRIPTS[platform];
            var filename = FILENAMES[platform];
            if (content && filename) {
                triggerDownload(content, filename);
            }
        };

        window.openDownload = function() {
            var eda = getEda();
            if (eda && eda.sys_Window) {
                eda.sys_Window.open('https://github.com/freerouting/freerouting/releases');
            }
        };

        window.retry = function() {
            var eda = getEda();
            if (eda && eda.sys_MessageBus) {
                eda.sys_MessageBus.publish('freerouting-service-dialog', { type: 'retry' });
            }
        };
    })();
    </script>
</body>
</html>
