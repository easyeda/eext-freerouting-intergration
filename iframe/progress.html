<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeRouting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            font-size: 12px;
            background: #F5F5F5;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 12px;
            gap: 6px;
        }
        .progress-row { display: flex; align-items: center; gap: 10px; }
        .bar { flex: 1; height: 8px; background: #E0E0E0; border-radius: 4px; overflow: hidden; }
        .fill { width: 0%; height: 100%; background: #007AFF; transition: width 0.3s ease; }
        .percent { flex: none; min-width: 34px; text-align: right; font-size: 13px; font-weight: 600; color: #007AFF; }
        .stop {
            flex: none;
            height: 28px;
            padding: 0 14px;
            font-size: 12px;
            color: #FFF;
            background: #FF3B30;
            border: 1px solid #FF3B30;
            cursor: pointer;
        }
        .stop:hover { background: #E0352B; border-color: #E0352B; }
        .stop:disabled { opacity: 0.6; cursor: default; }
        .message { font-size: 11px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <div class="progress-row">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <span class="percent" id="percent">0%</span>
        <button class="stop" id="stopBtn" onclick="stopRouting()">停止布线</button>
    </div>
    <div class="message" id="message"></div>

    <script>
    (function() {
        'use strict';

        var seen = {};
        var sessionToken = Date.now().toString(36) + Math.random().toString(36).slice(2);

        function getEdaCandidates() {
            var list = [];
            function add(candidate) {
                try {
                    if (candidate && list.indexOf(candidate) === -1) list.push(candidate);
                } catch (e) {}
            }
            try { if (typeof eda !== 'undefined') add(eda); } catch (e) {}
            try { if (window.eda) add(window.eda); } catch (e) {}
            try { if (window.parent && window.parent.eda) add(window.parent.eda); } catch (e) {}
            try { if (window.top && window.top.eda) add(window.top.eda); } catch (e) {}
            return list;
        }

        function getEda() {
            var list = getEdaCandidates();
            return list.length ? list[0] : null;
        }

        function render(payload) {
            if (!payload) return;
            if (payload._id) {
                if (seen[payload._id]) return;
                seen[payload._id] = true;
            }
            if (payload.type === 'progress') {
                var value = Number(payload.percentage);
                if (!isFinite(value)) value = 0;
                value = Math.max(0, Math.min(100, value));
                document.getElementById('fill').style.width = value + '%';
                document.getElementById('percent').textContent = Math.round(value) + '%';
                if (payload.message) document.getElementById('message').textContent = payload.message;
            } else if (payload.type === 'done') {
                if (payload.message) document.getElementById('message').textContent = payload.message;
            }
        }

        function handleMessage(msg) {
            render(msg);
        }

        var busBound = false;
        function bindBus() {
            if (busBound) return;
            var candidates = getEdaCandidates();
            var bound = false;
            for (var i = 0; i < candidates.length; i++) {
                var candidate = candidates[i];
                if (!candidate || !candidate.sys_MessageBus) continue;
                try { candidate.sys_MessageBus.subscribe('freerouting-log', handleMessage); bound = true; } catch (e) {}
                try { candidate.sys_MessageBus.subscribePublic('freerouting-log-public', handleMessage); bound = true; } catch (e) {}
            }
            if (bound) busBound = true;
        }
        bindBus();

        function processStorageEvents(raw) {
            if (!raw) return;
            var events;
            try {
                events = typeof raw === 'string' ? JSON.parse(raw) : raw;
            } catch (e) {
                return;
            }
            if (!events || !events.length) return;
            for (var i = 0; i < events.length; i++) {
                if (events[i]) render(events[i]);
            }
        }

        function pollStorageEvents() {
            var candidates = getEdaCandidates();
            for (var i = 0; i < candidates.length; i++) {
                var candidate = candidates[i];
                var storage = candidate && candidate.sys_Storage;
                if (!storage) continue;
                try {
                    var raw = storage.getExtensionUserConfig('__fr_custom_events__');
                    if (raw && typeof raw.then === 'function') {
                        raw.then(processStorageEvents, function() {});
                    } else {
                        processStorageEvents(raw);
                    }
                } catch (e) {}
            }
        }

        function sendToExtension(type, data) {
            var payload = {
                type: type,
                _token: sessionToken,
                _reqId: Date.now().toString(36) + Math.random().toString(36).slice(2)
            };
            if (data) {
                for (var key in data) {
                    if (Object.prototype.hasOwnProperty.call(data, key)) payload[key] = data[key];
                }
            }
            var candidates = getEdaCandidates();
            for (var i = 0; i < candidates.length; i++) {
                var candidate = candidates[i];
                if (!candidate) continue;
                if (candidate.sys_MessageBus) {
                    try { candidate.sys_MessageBus.publish('freerouting-iframe', payload); } catch (e) {}
                    try { candidate.sys_MessageBus.publishPublic('freerouting-iframe-public', payload); } catch (e) {}
                }
                if (candidate.sys_Storage) {
                    try {
                        var result = candidate.sys_Storage.setExtensionUserConfig('__fr_custom_cmd__', JSON.stringify(payload));
                        if (result && result.catch) result.catch(function() {});
                    } catch (e) {}
                }
            }
        }

        window.stopRouting = function() {
            var btn = document.getElementById('stopBtn');
            if (btn.disabled) return;
            btn.disabled = true;
            var eda = getEda();
            var text = (eda && eda.sys_I18n && eda.sys_I18n.text('Stopping routing...')) || '正在停止布线...';
            btn.textContent = text;
            document.getElementById('message').textContent = text;
            sendToExtension('stop', {});
        };

        (function initStopText() {
            var eda = getEda();
            if (eda && eda.sys_I18n) {
                var label = eda.sys_I18n.text('stop_routing');
                if (label) document.getElementById('stopBtn').textContent = label;
            }
        })();

        setInterval(function() {
            bindBus();
            pollStorageEvents();
        }, 400);
        pollStorageEvents();
    })();
    </script>
</body>
</html>
