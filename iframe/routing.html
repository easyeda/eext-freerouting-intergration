<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动布线(自定义)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            font-size: 12px;
            background: #F5F5F5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .settings-panel {
            width: 240px;
            min-width: 240px;
            background: #FAFAFA;
            border-right: 1px solid #E0E0E0;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .param-group { display: flex; flex-direction: column; gap: 3px; }
        .param-label { font-size: 11px; color: #666; display: flex; align-items: center; gap: 4px; }
        .param-help { color: #999; cursor: help; font-size: 10px; }
        .param-input {
            border: 1px solid #D0D0D0;
            background: #FFF;
            padding: 4px 8px;
            font-size: 12px;
            color: #333;
            outline: none;
            width: 100%;
        }
        .param-input:focus { border-color: #007AFF; }
        .toolbar-btn {
            background: #007AFF;
            border: 1px solid #007AFF;
            padding: 8px;
            font-size: 12px;
            color: #FFF;
            cursor: pointer;
            white-space: nowrap;
            width: 100%;
        }
        .toolbar-btn:hover { background: #0066DD; border-color: #0066DD; }
        .toolbar-btn:active { background: #0055CC; }
        .toolbar-btn.cancel { background: #FF3B30; border-color: #FF3B30; }
        .toolbar-btn.cancel:hover { background: #E0352B; }
        .log-panel {
            flex: 1;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .log-header {
            background: #FAFAFA;
            border-bottom: 1px solid #E0E0E0;
            padding: 4px 8px;
            font-size: 11px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .log-content {
            flex: 1;
            padding: 8px;
            font-family: 'Consolas', 'SF Mono', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.5;
            overflow-y: auto;
            background: #FDFDFD;
        }
        .log-line { white-space: pre-wrap; word-break: break-all; color: #444; margin-bottom: 2px; }
        .log-line.info { color: #007AFF; }
        .log-line.success { color: #34C759; font-weight: 500; }
        .log-line.error { color: #FF3B30; font-weight: 500; }
        .log-line.warn { color: #FF9500; }
        .statusbar {
            background: #E8E8E8;
            border-top: 1px solid #D0D0D0;
            padding: 4px 12px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="settings-panel">
            <div class="param-group">
                <label class="param-label">最大轮数 (max_passes) <span class="param-help" title="布线迭代次数">ⓘ</span></label>
                <input type="number" class="param-input" id="maxPasses" value="100" min="1" max="1000">
            </div>
            <div class="param-group">
                <label class="param-label">过孔成本 (via_costs) <span class="param-help" title="过孔的成本权重，越高越少使用过孔">ⓘ</span></label>
                <input type="number" class="param-input" id="viaCosts" value="50" min="1" max="1000">
            </div>
            <div class="param-group">
                <label class="param-label">最大线程数 (max_threads) <span class="param-help" title="并行布线的线程数">ⓘ</span></label>
                <input type="number" class="param-input" id="maxThreads" value="4" min="1" max="32">
            </div>
            <div class="param-group">
                <label class="param-label">改进阈值 (improvement_threshold) <span class="param-help" title="控制停止条件，0 表示完全布线">ⓘ</span></label>
                <input type="number" class="param-input" id="improvementThreshold" value="0" min="0" max="1" step="0.001">
            </div>
            <div class="param-group">
                <label class="param-label">拉紧精度 (trace_pull_tight_accuracy) <span class="param-help" title="走线拉紧的精度">ⓘ</span></label>
                <input type="number" class="param-input" id="tracePullTightAccuracy" value="500" min="1" max="10000">
            </div>
            <div class="param-group">
                <label class="param-label">撕裂成本 (start_ripup_costs) <span class="param-help" title="撕裂已有走线的起始成本">ⓘ</span></label>
                <input type="number" class="param-input" id="startRipupCosts" value="100" min="1" max="10000">
            </div>
            <div class="param-group">
                <label class="param-label">自动缩颈 (automatic_neckdown) <span class="param-help" title="自动在狭窄区域缩小走线宽度">ⓘ</span></label>
                <select class="param-input" id="automaticNeckdown"><option value="true">启用</option><option value="false">禁用</option></select>
            </div>
            <div class="param-group">
                <label class="param-label">允许多种过孔 (allowed_via_types) <span class="param-help" title="允许使用不同类型的过孔">ⓘ</span></label>
                <select class="param-input" id="allowedViaTypes"><option value="true">允许</option><option value="false">禁止</option></select>
            </div>
            <div class="param-group">
                <label class="param-label">完成后自动 DRC <span class="param-help" title="布线完成后自动执行设计规则检查">ⓘ</span></label>
                <select class="param-input" id="autoDrc"><option value="true">启用</option><option value="false">禁用</option></select>
            </div>
            <button class="toolbar-btn" id="btnRoute" style="margin-top:auto;">开始布线</button>
        </div>
        <div class="log-panel">
            <div class="log-header">
                <span>运行日志</span>
                <span id="logCount">0 行</span>
            </div>
            <div class="log-content" id="logContainer"></div>
        </div>
    </div>
    <div class="statusbar">
        <span id="statusText">FreeRouting 自动布线(自定义)</span>
    </div>
    <script>
    (function() {
        'use strict';

        function getEda() {
            try {
                if (window.parent && window.parent.eda) return window.parent.eda;
                if (window.top && window.top.eda) return window.top.eda;
                if (window.eda) return window.eda;
            } catch (e) {}
            return null;
        }

        function sendToExtension(type, data) {
            var eda = getEda();
            if (eda && eda.sys_MessageBus) {
                eda.sys_MessageBus.publish('freerouting-iframe', Object.assign({ type: type }, data));
            }
        }

        var MAX_LOG_LINES = 500;
        var isRouting = false;
        var logLineCount = 0;

        var dom = {
            maxPasses: document.getElementById('maxPasses'),
            btnRoute: document.getElementById('btnRoute'),
            logContainer: document.getElementById('logContainer'),
            logCount: document.getElementById('logCount')
        };

        function ts() {
            var d = new Date();
            return ('0' + d.getHours()).slice(-2) + ':' +
                   ('0' + d.getMinutes()).slice(-2) + ':' +
                   ('0' + d.getSeconds()).slice(-2) + '.' +
                   ('00' + d.getMilliseconds()).slice(-3);
        }

        function log(msg, type) {
            if (!msg) return;
            logLineCount++;
            var line = document.createElement('div');
            line.className = 'log-line ' + (type || '');
            line.textContent = ('00' + logLineCount).slice(-3) + ' [' + ts() + '] ' + msg;
            dom.logContainer.appendChild(line);
            while (dom.logContainer.children.length > MAX_LOG_LINES) {
                dom.logContainer.removeChild(dom.logContainer.firstChild);
            }
            dom.logCount.textContent = logLineCount + ' 行';
            dom.logContainer.scrollTop = dom.logContainer.scrollHeight;
        }

        function clearLog() {
            dom.logContainer.innerHTML = '';
            logLineCount = 0;
            dom.logCount.textContent = '0 行';
        }

        function setUI(routing) {
            isRouting = routing;
            dom.btnRoute.textContent = routing ? '停止布线' : '开始布线';
            dom.btnRoute.className = routing ? 'toolbar-btn cancel' : 'toolbar-btn';
        }

        function getOptions() {
            return {
                maxPasses: parseInt(dom.maxPasses.value) || 100,
                enableJlcPostprocess: true,
                autoDrc: document.getElementById('autoDrc').value === 'true',
                routerSettings: {
                    via_costs: parseInt(document.getElementById('viaCosts').value) || 50,
                    max_threads: parseInt(document.getElementById('maxThreads').value) || 4,
                    improvement_threshold: parseFloat(document.getElementById('improvementThreshold').value) || 0,
                    trace_pull_tight_accuracy: parseInt(document.getElementById('tracePullTightAccuracy').value) || 500,
                    start_ripup_costs: parseInt(document.getElementById('startRipupCosts').value) || 100,
                    automatic_neckdown: document.getElementById('automaticNeckdown').value === 'true',
                    allowed_via_types: document.getElementById('allowedViaTypes').value === 'true'
                }
            };
        }

        dom.btnRoute.addEventListener('click', function() {
            if (isRouting) {
                setUI(false);
                sendToExtension('stop', {});
                log('用户停止布线', 'warn');
            } else {
                clearLog();
                setUI(true);
                var opts = getOptions();
                log('发送布线请求，最大轮数: ' + opts.maxPasses, 'info');
                sendToExtension('start-custom', { options: opts });
            }
        });

        // 接收扩展推送的日志
        var logBound = false;
        function bindLog() {
            if (logBound) return true;
            var eda = getEda();
            if (!eda || !eda.sys_MessageBus) return false;
            logBound = true;

            eda.sys_MessageBus.subscribe('freerouting-log', function(msg) {
                if (msg && msg.type === 'log') {
                    log(msg.message, msg.level || 'info');
                } else if (msg && msg.type === 'done') {
                    log(msg.message || '布线结束', msg.level || 'success');
                    setUI(false);
                }
            });
            log('EDA MessageBus 已连接', 'success');
            return true;
        }

        if (!bindLog()) {
            var retries = 0;
            var retryTimer = setInterval(function() {
                if (bindLog() || ++retries > 10) {
                    clearInterval(retryTimer);
                    if (!logBound) log('无法连接 EDA MessageBus，请重新打开面板', 'error');
                }
            }, 500);
        }
    })();
    </script>
</body>
</html>
