<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeRouting 自动布线</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            font-size: 12px;
            background: #F5F5F5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background: #FAFAFA;
            border-bottom: 1px solid #E0E0E0;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .toolbar-group { display: flex; align-items: center; gap: 6px; }
        .toolbar-label { color: #666; font-size: 11px; white-space: nowrap; }
        .toolbar-input {
            border: 1px solid #D0D0D0;
            background: #FFF;
            padding: 4px 8px;
            font-size: 12px;
            color: #333;
            outline: none;
        }
        .toolbar-input:focus { border-color: #007AFF; }
        .toolbar-input-small { width: 60px; text-align: center; }
        .toolbar-btn {
            background: #007AFF;
            border: 1px solid #007AFF;
            padding: 4px 12px;
            font-size: 11px;
            color: #FFF;
            cursor: pointer;
            white-space: nowrap;
        }
        .toolbar-btn:hover:not(:disabled) { background: #0066DD; border-color: #0066DD; }
        .toolbar-btn:active:not(:disabled) { background: #0055CC; }
        .toolbar-btn:disabled { background: #B0B0B0; border-color: #B0B0B0; cursor: not-allowed; }
        .toolbar-btn.cancel { background: #FF3B30; border-color: #FF3B30; }
        .toolbar-btn.cancel:hover:not(:disabled) { background: #E0352B; }
        .toolbar-separator { width: 1px; height: 20px; background: #D0D0D0; margin: 0 4px; }
        input[type="checkbox"] { cursor: pointer; }
        .advanced-panel {
            width: 100%;
            background: #F8F8F8;
            border-top: 1px solid #E0E0E0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease-out;
        }
        .advanced-panel.open { max-height: 300px; }
        .advanced-content {
            padding: 12px 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px 20px;
        }
        .param-group { display: flex; flex-direction: column; gap: 4px; }
        .param-label { font-size: 11px; color: #666; display: flex; align-items: center; gap: 4px; }
        .param-help { color: #999; cursor: help; font-size: 10px; }
        .param-input {
            border: 1px solid #D0D0D0;
            background: #FFF;
            padding: 4px 8px;
            font-size: 12px;
            color: #333;
            outline: none;
        }
        .param-input:focus { border-color: #007AFF; }
        .log-panel {
            flex: 1;
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            margin: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .log-header {
            background: #FAFAFA;
            border-bottom: 1px solid #E0E0E0;
            padding: 4px 8px;
            font-size: 11px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .log-content {
            flex: 1;
            padding: 8px;
            font-family: 'Consolas', 'SF Mono', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.5;
            overflow-y: auto;
            background: #FDFDFD;
        }
        .log-line { white-space: pre-wrap; word-break: break-all; color: #444; margin-bottom: 2px; }
        .log-line.info { color: #007AFF; }
        .log-line.success { color: #34C759; font-weight: 500; }
        .log-line.error { color: #FF3B30; font-weight: 500; }
        .log-line.warn { color: #FF9500; }
        .statusbar {
            background: #E8E8E8;
            border-top: 1px solid #D0D0D0;
            padding: 4px 12px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <span class="toolbar-label">最大轮数:</span>
            <input type="number" class="toolbar-input toolbar-input-small" id="maxPasses" value="100" min="1" max="1000">
        </div>
        <div class="toolbar-separator"></div>
        <div class="toolbar-group">
            <input type="checkbox" id="enableAdvancedSettings">
            <span class="toolbar-label" style="cursor: pointer;" onclick="document.getElementById('enableAdvancedSettings').click()">使用高级设置</span>
        </div>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="btnStart">开始布线</button>
        <button class="toolbar-btn cancel" id="btnCancel" disabled>取消</button>
    </div>
    <div class="advanced-panel" id="advancedPanel">
        <div class="advanced-content">
            <div class="param-group">
                <label class="param-label">过孔成本 (via_costs) <span class="param-help" title="过孔的成本权重，越高越少使用过孔">ⓘ</span></label>
                <input type="number" class="param-input" id="viaCosts" value="50" min="1" max="1000">
            </div>
            <div class="param-group">
                <label class="param-label">最大线程数 (max_threads) <span class="param-help" title="并行布线的线程数">ⓘ</span></label>
                <input type="number" class="param-input" id="maxThreads" value="4" min="1" max="32">
            </div>
            <div class="param-group">
                <label class="param-label">扇出轮数 (fanout_max_passes) <span class="param-help" title="扇出阶段的最大迭代轮数">ⓘ</span></label>
                <input type="number" class="param-input" id="fanoutMaxPasses" value="20" min="1" max="100">
            </div>
            <div class="param-group">
                <label class="param-label">改进阈值 (improvement_threshold) <span class="param-help" title="控制停止条件">ⓘ</span></label>
                <input type="number" class="param-input" id="improvementThreshold" value="0" min="0" max="1" step="0.001">
            </div>
            <div class="param-group">
                <label class="param-label">拉紧精度 (trace_pull_tight_accuracy) <span class="param-help" title="走线拉紧的精度">ⓘ</span></label>
                <input type="number" class="param-input" id="tracePullTightAccuracy" value="500" min="1" max="10000">
            </div>
            <div class="param-group">
                <label class="param-label">撕裂成本 (start_ripup_costs) <span class="param-help" title="撕裂已有走线的起始成本">ⓘ</span></label>
                <input type="number" class="param-input" id="startRipupCosts" value="100" min="1" max="10000">
            </div>
            <div class="param-group">
                <label class="param-label">自动缩颈 (automatic_neckdown) <span class="param-help" title="自动在狭窄区域缩小走线宽度">ⓘ</span></label>
                <select class="param-input" id="automaticNeckdown"><option value="true">启用</option><option value="false">禁用</option></select>
            </div>
            <div class="param-group">
                <label class="param-label">允许多种过孔 (allowed_via_types) <span class="param-help" title="允许使用不同类型的过孔">ⓘ</span></label>
                <select class="param-input" id="allowedViaTypes"><option value="true">允许</option><option value="false">禁止</option></select>
            </div>
        </div>
    </div>
    <div class="log-panel">
        <div class="log-header">
            <span>运行日志</span>
            <span id="logCount">0 行</span>
        </div>
        <div class="log-content" id="logContainer"></div>
    </div>
    <div class="statusbar">
        <span id="statusText">FreeRouting 自动布线 | REST API: 127.0.0.1:37863</span>
    </div>
    <script>
        function getParentEda() {
            try {
                if (window.parent && window.parent.eda) return window.parent.eda;
                if (window.top && window.top.eda) return window.top.eda;
                if (window.eda) return window.eda;
            } catch (e) {}
            return undefined;
        }

        var API_BASE = 'http://127.0.0.1:37863/v1';
        var POLL_INTERVAL = 2000;
        var PREVIEW_INTERVAL = 5;

        var isRouting = false;
        var cancelled = false;
        var pollTimer = null;
        var polling = false;
        var importing = false;
        var lineCount = 0;
        var MAX_LINES = 200;
        var lastLogState = '';

        var maxPassesEl = document.getElementById('maxPasses');
        var enableAdvancedSettingsEl = document.getElementById('enableAdvancedSettings');
        var btnStart = document.getElementById('btnStart');
        var btnCancel = document.getElementById('btnCancel');
        var logContainer = document.getElementById('logContainer');
        var logCountEl = document.getElementById('logCount');
        var advancedPanel = document.getElementById('advancedPanel');
        var statusText = document.getElementById('statusText');

        function addLog(message, type) {
            if (!message || !message.trim()) return;
            message.split('\n').forEach(function(line) {
                if (line.trim()) {
                    var div = document.createElement('div');
                    div.className = 'log-line ' + (type || '');
                    div.textContent = line;
                    logContainer.appendChild(div);
                    lineCount++;
                    while (logContainer.children.length > MAX_LINES) {
                        logContainer.removeChild(logContainer.firstChild);
                    }
                }
            });
            logCountEl.textContent = Math.min(lineCount, MAX_LINES) + ' 行';
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            logContainer.innerHTML = '';
            lineCount = 0;
            logCountEl.textContent = '0 行';
            lastLogState = '';
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function setRouting(routing) {
            isRouting = routing;
            btnStart.disabled = routing;
            btnCancel.disabled = !routing;
            maxPassesEl.disabled = routing;
            enableAdvancedSettingsEl.disabled = routing;
            if (!routing) {
                stopPolling();
                polling = false;
            }
        }

        enableAdvancedSettingsEl.addEventListener('change', function() {
            advancedPanel.classList.toggle('open', enableAdvancedSettingsEl.checked);
        });

        function collectOptions() {
            var options = {
                maxPasses: parseInt(maxPassesEl.value) || 100,
                enableJlcPostprocess: true
            };
            if (enableAdvancedSettingsEl.checked) {
                options.routerSettings = {
                    via_costs: parseInt(document.getElementById('viaCosts').value) || 50,
                    max_threads: parseInt(document.getElementById('maxThreads').value) || 4,
                    fanout_max_passes: parseInt(document.getElementById('fanoutMaxPasses').value) || 20,
                    improvement_threshold: parseFloat(document.getElementById('improvementThreshold').value) || 0,
                    trace_pull_tight_accuracy: parseInt(document.getElementById('tracePullTightAccuracy').value) || 500,
                    start_ripup_costs: parseInt(document.getElementById('startRipupCosts').value) || 100,
                    automatic_neckdown: document.getElementById('automaticNeckdown').value === 'true',
                    allowed_via_types: document.getElementById('allowedViaTypes').value === 'true'
                };
            }
            return options;
        }

        async function apiRequest(method, path, body) {
            var url = API_BASE + path;
            var init = { method: method };
            if (body) {
                init.headers = { 'Content-Type': 'application/json' };
                init.body = JSON.stringify(body);
            }
            var res = await fetch(url, init);
            if (!res.ok) {
                var text = await res.text().catch(function() { return ''; });
                throw new Error('API ' + method + ' ' + path + ' (' + res.status + '): ' + text);
            }
            if (res.status === 204) return null;
            return res.json();
        }

        function isTerminalState(state) {
            return ['COMPLETED', 'FAILED', 'CANCELLED', 'TIMED_OUT', 'TERMINATED'].indexOf(state) !== -1;
        }

        async function startRouting(dsnBase64, dsnFilename) {
            var options = collectOptions();
            var maxPasses = options.maxPasses;
            try {
                addLog('正在创建布线会话...', 'info');
                var session = await apiRequest('POST', '/sessions/create');
                addLog('会话已创建: ' + session.id, 'info');

                var jobName = dsnFilename.replace(/\.dsn$/i, '');
                var job = await apiRequest('POST', '/jobs/enqueue', {
                    session_id: session.id,
                    name: jobName,
                    priority: 'NORMAL'
                });
                var jobId = job.id;
                addLog('任务已创建: ' + jobId, 'info');

                var settings = { max_passes: maxPasses };
                if (options.routerSettings) {
                    Object.assign(settings, options.routerSettings);
                    addLog('高级设置已启用', 'info');
                }
                addLog('最大轮数: ' + maxPasses, 'info');
                await apiRequest('POST', '/jobs/' + jobId + '/settings', settings);

                if (cancelled) { setRouting(false); return; }

                addLog('正在上传 DSN 文件: ' + dsnFilename, 'info');
                await apiRequest('POST', '/jobs/' + jobId + '/input', {
                    filename: dsnFilename,
                    data: dsnBase64
                });
                addLog('DSN 文件上传成功', 'success');

                if (cancelled) { setRouting(false); return; }

                addLog('正在启动布线...', 'info');
                await apiRequest('PUT', '/jobs/' + jobId + '/start');
                addLog('布线已启动', 'success');

                var pollCount = 0;
                pollTimer = setInterval(function() {
                    if (cancelled || polling) return;
                    pollTick(jobId, maxPasses, ++pollCount);
                }, POLL_INTERVAL);

            } catch (err) {
                addLog('错误: ' + err.message, 'error');
                setRouting(false);
            }
        }

        async function pollTick(jobId, maxPasses, pollCount) {
            if (cancelled) { setRouting(false); return; }
            polling = true;
            try {
                var status = await apiRequest('GET', '/jobs/' + jobId);
                var stateKey = status.state + '|' + (status.stage || '') + '|' + (status.current_pass || 0);

                if (stateKey !== lastLogState) {
                    lastLogState = stateKey;
                    var pass = status.current_pass || 0;
                    var pct = maxPasses > 0 ? Math.min(Math.round((pass / maxPasses) * 100), 99) : 0;
                    addLog('状态: ' + status.state + ' | 阶段: ' + (status.stage || '-') + ' | 轮次: ' + pass + '/' + maxPasses + ' (' + pct + '%)', 'info');
                }

                if (isTerminalState(status.state)) {
                    stopPolling();
                    if (status.state === 'COMPLETED') {
                        await handleCompleted(jobId);
                    } else {
                        addLog('布线结束，状态: ' + status.state, status.state === 'COMPLETED' ? 'success' : 'warn');
                    }
                    setRouting(false);
                    return;
                }

                if (pollCount % PREVIEW_INTERVAL === 0 && status.state === 'RUNNING' && !importing) {
                    await doPreview(jobId);
                }
            } catch (err) {
                addLog('轮询错误: ' + err.message, 'error');
                setRouting(false);
            } finally {
                polling = false;
            }
        }

        async function handleCompleted(jobId) {
            try {
                addLog('布线完成，正在获取最终结果...', 'success');
                var output = await apiRequest('GET', '/jobs/' + jobId + '/output');

                if (output && output.statistics) {
                    var s = output.statistics;
                    var nets = s.routed_net_count || s.nets && s.nets.total_count || 0;
                    var vias = s.via_count || s.vias && s.vias.total_count || 0;
                    var traces = s.traces && s.traces.total_count || 0;
                    addLog('统计: 已布线网络 ' + nets + ' | 过孔 ' + vias + ' | 走线 ' + traces, 'info');
                }

                if (output && output.data) {
                    sendToExtension('complete', {
                        data: output.data,
                        filename: output.filename || 'routing_result.ses'
                    });
                    addLog('SES 数据已发送到 EasyEDA', 'success');
                } else {
                    addLog('未获取到输出数据', 'error');
                }
            } catch (err) {
                addLog('获取结果错误: ' + err.message, 'error');
            }
        }

        async function doPreview(jobId) {
            importing = true;
            try {
                var res = await fetch(API_BASE + '/jobs/' + jobId + '/output');
                if (res.status === 200 || res.status === 202) {
                    var partial = await res.json();
                    if (partial && partial.data) {
                        sendToExtension('preview', {
                            data: partial.data,
                            filename: partial.filename || 'routing_result.ses'
                        });
                        if (partial.statistics) {
                            var ps = partial.statistics;
                            addLog('[预览] 已布线: ' + (ps.routed_net_count || 0) + ' | 过孔: ' + (ps.via_count || 0), 'info');
                        }
                    }
                }
            } catch (e) {
                // ignore preview errors
            } finally {
                importing = false;
            }
        }

        btnStart.addEventListener('click', async function() {
            if (isRouting) return;
            clearLog();
            cancelled = false;
            setRouting(true);
            addLog('正在请求 DSN 文件...', 'info');
            sendToExtension('start', {});
        });

        btnCancel.addEventListener('click', function() {
            cancelled = true;
            stopPolling();
            addLog('布线已停止', 'warn');
            setRouting(false);
            sendToExtension('cancel', {});
        });

        function subscribeDsn() {
            var eda = getParentEda();
            if (eda && eda.sys_MessageBus) {
                eda.sys_MessageBus.subscribe('freerouting-dsn', function(msg) {
                    if (msg && msg.data && msg.filename) {
                        addLog('DSN 文件: ' + msg.filename, 'success');
                        startRouting(msg.data, msg.filename);
                    } else {
                        addLog('获取 DSN 文件失败' + (msg && msg.error ? ': ' + msg.error : ''), 'error');
                        setRouting(false);
                    }
                });
                return true;
            }
            return false;
        }

        if (!subscribeDsn()) {
            var retryCount = 0;
            var retryTimer = setInterval(function() {
                retryCount++;
                if (subscribeDsn()) {
                    clearInterval(retryTimer);
                } else if (retryCount > 10) {
                    clearInterval(retryTimer);
                    addLog('无法连接到 EDA MessageBus，请重新打开面板', 'error');
                }
            }, 500);
        }

        function sendToExtension(type, data) {
            var eda = getParentEda();
            if (eda && eda.sys_MessageBus) {
                eda.sys_MessageBus.publish('freerouting-iframe', Object.assign({ type: type }, data));
            }
        }
    </script>
</body>
</html>
