<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeRouting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            font-size: 12px;
            background: #F5F5F5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .settings-panel {
            width: 240px;
            min-width: 240px;
            background: #FAFAFA;
            border-right: 1px solid #E0E0E0;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .param-group { display: flex; flex-direction: column; gap: 3px; }
        .param-label { font-size: 11px; color: #666; display: flex; align-items: center; gap: 4px; }
        .param-help { color: #999; cursor: help; font-size: 10px; }
        .param-input {
            border: 1px solid #D0D0D0;
            background: #FFF;
            padding: 4px 8px;
            font-size: 12px;
            color: #333;
            outline: none;
            width: 100%;
        }
        .param-input:focus { border-color: #007AFF; }
        .toolbar-btn {
            background: #007AFF;
            border: 1px solid #007AFF;
            padding: 8px;
            font-size: 12px;
            color: #FFF;
            cursor: pointer;
            white-space: nowrap;
            width: 100%;
        }
        .toolbar-btn:hover { background: #0066DD; border-color: #0066DD; }
        .toolbar-btn:active { background: #0055CC; }
        .toolbar-btn.cancel { background: #FF3B30; border-color: #FF3B30; }
        .toolbar-btn.cancel:hover { background: #E0352B; }
        .log-panel {
            flex: 1;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .log-header {
            background: #FAFAFA;
            border-bottom: 1px solid #E0E0E0;
            padding: 4px 8px;
            font-size: 11px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .log-content {
            flex: 1;
            padding: 8px;
            font-family: 'Consolas', 'SF Mono', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.5;
            overflow-y: auto;
            background: #FDFDFD;
        }
        .log-line { white-space: pre-wrap; word-break: break-all; color: #444; margin-bottom: 2px; }
        .log-line.info { color: #007AFF; }
        .log-line.success { color: #34C759; font-weight: 500; }
        .log-line.error { color: #FF3B30; font-weight: 500; }
        .log-line.warn { color: #FF9500; }
        .statusbar {
            background: #E8E8E8;
            border-top: 1px solid #D0D0D0;
            padding: 4px 12px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="settings-panel">
            <div class="param-group">
                <label class="param-label" data-i18n="max_passes_label"></label>
                <input type="number" class="param-input" id="maxPasses" value="100" min="1" max="1000">
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="via_costs_label"></label>
                <input type="number" class="param-input" id="viaCosts" value="50" min="1" max="1000">
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="max_threads_label"></label>
                <input type="number" class="param-input" id="maxThreads" value="4" min="1" max="32">
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="improvement_threshold_label"></label>
                <input type="number" class="param-input" id="improvementThreshold" value="0" min="0" max="1" step="0.001">
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="trace_pull_tight_label"></label>
                <input type="number" class="param-input" id="tracePullTightAccuracy" value="500" min="1" max="10000">
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="start_ripup_label"></label>
                <input type="number" class="param-input" id="startRipupCosts" value="100" min="1" max="10000">
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="automatic_neckdown_label"></label>
                <select class="param-input" id="automaticNeckdown"><option value="true" data-i18n-text="enabled"></option><option value="false" data-i18n-text="disabled"></option></select>
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="allowed_via_types_label"></label>
                <select class="param-input" id="allowedViaTypes"><option value="true" data-i18n-text="allowed"></option><option value="false" data-i18n-text="forbidden"></option></select>
            </div>
            <div class="param-group">
                <label class="param-label" data-i18n="auto_drc_label"></label>
                <select class="param-input" id="autoDrc"><option value="true" data-i18n-text="enabled"></option><option value="false" data-i18n-text="disabled"></option></select>
            </div>
            <button class="toolbar-btn" id="btnRoute" style="margin-top:auto;" data-i18n-text="start_routing"></button>
        </div>
        <div class="log-panel">
            <div class="log-header">
                <span data-i18n-text="log_title"></span>
                <span id="logCount">0</span>
            </div>
            <div class="log-content" id="logContainer"></div>
        </div>
    </div>
    <div class="statusbar">
        <span id="statusText" data-i18n-text="statusbar_text"></span>
    </div>
    <script>
    (function() {
        'use strict';

        var i18n = {
            zh: {
                max_passes_label: '最大轮数 (max_passes) <span class="param-help" title="布线迭代次数">ⓘ</span>',
                via_costs_label: '过孔成本 (via_costs) <span class="param-help" title="过孔的成本权重，越高越少使用过孔">ⓘ</span>',
                max_threads_label: '最大线程数 (max_threads) <span class="param-help" title="并行布线的线程数">ⓘ</span>',
                improvement_threshold_label: '改进阈值 (improvement_threshold) <span class="param-help" title="控制停止条件，0 表示完全布线">ⓘ</span>',
                trace_pull_tight_label: '拉紧精度 (trace_pull_tight_accuracy) <span class="param-help" title="走线拉紧的精度">ⓘ</span>',
                start_ripup_label: '撕裂成本 (start_ripup_costs) <span class="param-help" title="撕裂已有走线的起始成本">ⓘ</span>',
                automatic_neckdown_label: '自动缩颈 (automatic_neckdown) <span class="param-help" title="自动在狭窄区域缩小走线宽度">ⓘ</span>',
                allowed_via_types_label: '允许多种过孔 (allowed_via_types) <span class="param-help" title="允许使用不同类型的过孔">ⓘ</span>',
                auto_drc_label: '完成后自动 DRC <span class="param-help" title="布线完成后自动执行设计规则检查">ⓘ</span>',
                enabled: '启用',
                disabled: '禁用',
                allowed: '允许',
                forbidden: '禁止',
                start_routing: '开始布线',
                stop_routing: '停止布线',
                log_title: '运行日志',
                statusbar_text: 'FreeRouting 自定义自动布线',
                user_stop: '用户停止布线',
                send_request: '发送布线请求，最大轮数: ',
                routing_done: '布线结束',
                eda_connected: 'EDA MessageBus 已连接',
                eda_failed: '无法连接 EDA MessageBus，请重新打开面板',
                dsn_received: '收到 DSN: ',
                dsn_failed: 'DSN 获取失败',
                lines: ' 行'
            },
            en: {
                max_passes_label: 'Max Passes (max_passes) <span class="param-help" title="Routing iteration count">ⓘ</span>',
                via_costs_label: 'Via Cost (via_costs) <span class="param-help" title="Cost weight for vias, higher = fewer vias">ⓘ</span>',
                max_threads_label: 'Max Threads (max_threads) <span class="param-help" title="Number of threads for parallel routing">ⓘ</span>',
                improvement_threshold_label: 'Improvement Threshold <span class="param-help" title="Stop condition, 0 = complete routing">ⓘ</span>',
                trace_pull_tight_label: 'Trace Pull Tight Accuracy <span class="param-help" title="Accuracy for trace pull-tight optimization">ⓘ</span>',
                start_ripup_label: 'Start Ripup Costs <span class="param-help" title="Starting cost for ripping up existing traces">ⓘ</span>',
                automatic_neckdown_label: 'Automatic Neckdown <span class="param-help" title="Reduce trace width in narrow areas">ⓘ</span>',
                allowed_via_types_label: 'Allowed Via Types <span class="param-help" title="Allow using different types of vias">ⓘ</span>',
                auto_drc_label: 'Auto DRC <span class="param-help" title="Run DRC automatically after routing">ⓘ</span>',
                enabled: 'Enabled',
                disabled: 'Disabled',
                allowed: 'Allowed',
                forbidden: 'Forbidden',
                start_routing: 'Start Routing',
                stop_routing: 'Stop Routing',
                log_title: 'Log',
                statusbar_text: 'FreeRouting Custom Auto Route',
                user_stop: 'User stopped routing',
                send_request: 'Sending routing request, max passes: ',
                routing_done: 'Routing finished',
                eda_connected: 'EDA MessageBus connected',
                eda_failed: 'Cannot connect EDA MessageBus, please reopen panel',
                dsn_received: 'DSN received: ',
                dsn_failed: 'DSN fetch failed',
                lines: ' lines'
            }
        };

        // Detect language from EDA API
        var lang = 'zh';
        var T = i18n[lang];

        function applyI18n() {
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                el.innerHTML = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-text]').forEach(function(el) {
                el.textContent = t(el.getAttribute('data-i18n-text'));
            });
            document.title = t('statusbar_text');
        }

        (function detectLangThenInit() {
            var retries = 0;
            function tryDetect() {
                var eda = getEda();
                if (eda && eda.sys_I18n) {
                    eda.sys_I18n.getCurrentLanguage().then(function(edaLang) {
                        if (edaLang && edaLang.indexOf('zh') === -1) {
                            lang = 'en';
                            T = i18n[lang];
                            applyI18n();
                        }
                        initMessageBus();
                    }).catch(function() { initMessageBus(); });
                } else if (++retries < 20) {
                    setTimeout(tryDetect, 200);
                } else {
                    initMessageBus();
                }
            }
            tryDetect();
        })();

        function t(key) { return T[key] || key; }

        // Apply default i18n
        applyI18n();

        function getEda() {
            try {
                if (window.parent && window.parent.eda) return window.parent.eda;
                if (window.top && window.top.eda) return window.top.eda;
                if (window.eda) return window.eda;
            } catch (e) {}
            return null;
        }

        function sendToExtension(type, data) {
            var eda = getEda();
            if (eda && eda.sys_MessageBus) {
                eda.sys_MessageBus.publish('freerouting-iframe', Object.assign({ type: type }, data));
            }
        }

        var MAX_LOG_LINES = 500;
        var isRouting = false;
        var logLineCount = 0;

        var dom = {
            maxPasses: document.getElementById('maxPasses'),
            btnRoute: document.getElementById('btnRoute'),
            logContainer: document.getElementById('logContainer'),
            logCount: document.getElementById('logCount')
        };

        function ts() {
            var d = new Date();
            return ('0' + d.getHours()).slice(-2) + ':' +
                   ('0' + d.getMinutes()).slice(-2) + ':' +
                   ('0' + d.getSeconds()).slice(-2) + '.' +
                   ('00' + d.getMilliseconds()).slice(-3);
        }

        function log(msg, type) {
            if (!msg) return;
            logLineCount++;
            var line = document.createElement('div');
            line.className = 'log-line ' + (type || '');
            line.textContent = ('00' + logLineCount).slice(-3) + ' [' + ts() + '] ' + msg;
            dom.logContainer.appendChild(line);
            while (dom.logContainer.children.length > MAX_LOG_LINES) {
                dom.logContainer.removeChild(dom.logContainer.firstChild);
            }
            dom.logCount.textContent = logLineCount + t('lines');
            dom.logContainer.scrollTop = dom.logContainer.scrollHeight;
        }

        function clearLog() {
            dom.logContainer.innerHTML = '';
            logLineCount = 0;
            dom.logCount.textContent = '0' + t('lines');
        }

        function setUI(routing) {
            isRouting = routing;
            dom.btnRoute.textContent = routing ? t('stop_routing') : t('start_routing');
            dom.btnRoute.className = routing ? 'toolbar-btn cancel' : 'toolbar-btn';
            if (routing) dsnHandled = false;
        }

        function getOptions() {
            return {
                maxPasses: parseInt(dom.maxPasses.value) || 100,
                enableJlcPostprocess: true,
                autoDrc: document.getElementById('autoDrc').value === 'true',
                routerSettings: {
                    via_costs: parseInt(document.getElementById('viaCosts').value) || 50,
                    max_threads: parseInt(document.getElementById('maxThreads').value) || 4,
                    improvement_threshold: parseFloat(document.getElementById('improvementThreshold').value) || 0,
                    trace_pull_tight_accuracy: parseInt(document.getElementById('tracePullTightAccuracy').value) || 500,
                    start_ripup_costs: parseInt(document.getElementById('startRipupCosts').value) || 100,
                    automatic_neckdown: document.getElementById('automaticNeckdown').value === 'true',
                    allowed_via_types: document.getElementById('allowedViaTypes').value === 'true'
                }
            };
        }

        dom.btnRoute.addEventListener('click', function() {
            if (isRouting) {
                setUI(false);
                sendToExtension('stop', {});
                log(t('user_stop'), 'warn');
            } else {
                clearLog();
                setUI(true);
                var opts = getOptions();
                log(t('send_request') + opts.maxPasses, 'info');
                sendToExtension('start-custom', { options: opts });
            }
        });

        var logBound = false;
        var dsnHandled = false;

        function bindLog() {
            if (logBound) return true;
            var eda = getEda();
            if (!eda || !eda.sys_MessageBus) return false;
            logBound = true;

            eda.sys_MessageBus.subscribe('freerouting-log', function(msg) {
                if (msg && msg.type === 'log') {
                    log(msg.message, msg.level || 'info');
                } else if (msg && msg.type === 'done') {
                    log(msg.message || t('routing_done'), msg.level || 'success');
                    setUI(false);
                }
            });
            log(t('eda_connected'), 'success');
            return true;
        }

        function initMessageBus() {
            if (!bindLog()) {
                var retries = 0;
                var retryTimer = setInterval(function() {
                    if (bindLog() || ++retries > 10) {
                        clearInterval(retryTimer);
                        if (!logBound) log(t('eda_failed'), 'error');
                    }
                }, 500);
            }
        }
    })();
    </script>
</body>
</html>
